<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>待办清单</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { background: #f4f6f9; color: #1f2937; padding: 16px; max-width: 480px; margin: 0 auto; }
    header { margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #6b7280; }

    /* 输入区 */
    .input-box { display: flex; gap: 8px; margin-bottom: 14px; background: #fff; padding: 10px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .input-box input { flex: 1; border: none; outline: none; font-size: 15px; background: transparent; }
    .input-box button { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .input-box button:active { opacity: 0.85; }

    /* 状态筛选栏 */
    .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 8px; }
    .filter-btn { border: none; background: #e5e7eb; color: #374151; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .filter-btn.active { background: #1f2937; color: #fff; font-weight: 600; }

    /* 任务卡片 */
    .todo-list { display: flex; flex-direction: column; gap: 10px; }
    .todo-item { background: #fff; padding: 14px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 10px; }
    .todo-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .todo-title { font-size: 15px; line-height: 1.45; word-break: break-all; }
    .todo-title.done { text-decoration: line-through; color: #9ca3af; }
    .del-btn { background: none; border: none; color: #9ca3af; font-size: 13px; cursor: pointer; padding: 2px 4px; }
    .del-btn:hover { color: #ef4444; }

    /* 状态选择器 */
    .status-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .status-tag { border: 1px solid #e5e7eb; background: #f9fafb; color: #6b7280; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
    
    /* 四种状态的高亮配色 */
    .status-tag.active[data-status="未开始"] { background: #f3f4f6; border-color: #9ca3af; color: #374151; font-weight: 600; }
    .status-tag.active[data-status="正在进行"] { background: #dbeafe; border-color: #3b82f6; color: #1d4ed8; font-weight: 600; }
    .status-tag.active[data-status="收尾"] { background: #fef3c7; border-color: #f59e0b; color: #b45309; font-weight: 600; }
    .status-tag.active[data-status="已完成"] { background: #dcfce7; border-color: #22c55e; color: #15803d; font-weight: 600; }

    .empty { text-align: center; color: #9ca3af; font-size: 14px; padding: 40px 0; }
  </style>
</head>
<body>
  <header>
    <h1>待办事项管理</h1>
    <div class="subtitle" id="summary">加载中...</div>
  </header>

  <div class="input-box">
    <input type="text" id="todoInput" placeholder="输入新的待办事项..." />
    <button onclick="addTodo()">添加</button>
  </div>

  <div class="filters" id="filterBar">
    <button class="filter-btn active" onclick="setFilter('全部', this)">全部</button>
    <button class="filter-btn" onclick="setFilter('未开始', this)">未开始</button>
    <button class="filter-btn" onclick="setFilter('正在进行', this)">正在进行</button>
    <button class="filter-btn" onclick="setFilter('收尾', this)">收尾</button>
    <button class="filter-btn" onclick="setFilter('已完成', this)">已完成</button>
  </div>

  <div class="todo-list" id="todoList"></div>

  <script>
    const STATUSES = ["未开始", "正在进行", "收尾", "已完成"];
    let currentFilter = "全部";
    // 从本地存储读取历史数据，如果没有则给两条示例
    let todos = JSON.parse(localStorage.getItem("my_todos_v1")) || [
      { id: 1, text: "熟悉待办清单的状态切换功能", status: "正在进行" },
      { id: 2, text: "体验添加和删除一条新任务", status: "未开始" }
    ];

    function save() {
      localStorage.setItem("my_todos_v1", JSON.stringify(todos));
    }

    function addTodo() {
      const input = document.getElementById("todoInput");
      const text = input.value.trim();
      if (!text) return;
      todos.unshift({ id: Date.now(), text, status: "未开始" });
      input.value = "";
      save();
      render();
    }

    function changeStatus(id, newStatus) {
      const item = todos.find(t => t.id === id);
      if (item) {
        item.status = newStatus;
        save();
        render();
      }
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      save();
      render();
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    }

    function render() {
      const listEl = document.getElementById("todoList");
      const summaryEl = document.getElementById("summary");

      const doneCount = todos.filter(t => t.status === "已完成").length;
      summaryEl.textContent = `共 ${todos.length} 项任务 · 已完成 ${doneCount} 项`;

      const filtered = currentFilter === "全部"
        ? todos
        : todos.filter(t => t.status === currentFilter);

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty">当前分类下暂无待办事项</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(item => `
        <div class="todo-item">
          <div class="todo-top">
            <div class="todo-title ${item.status === '已完成' ? 'done' : ''}">${escapeHtml(item.text)}</div>
            <button class="del-btn" onclick="deleteTodo(${item.id})">删除</button>
          </div>
          <div class="status-group">
            ${STATUSES.map(st => `
              <button
                class="status-tag ${item.status === st ? 'active' : ''}"
                data-status="${st}"
                onclick="changeStatus(${item.id}, '${st}')"
              >${st}</button>
            `).join("")}
          </div>
        </div>
      `).join("");
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    // 支持按回车键直接添加
    document.getElementById("todoInput").addEventListener("keydown", e => {
      if (e.key === "Enter") addTodo();
    });

    render();
  </script>
</body>
</html>
