<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>待办清单</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { background: #f4f6f9; color: #1f2937; padding: 16px; max-width: 480px; margin: 0 auto; }
    header { margin-bottom: 14px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #6b7280; }

    /* 分区导航：工作 / 生活 / 学习 */
    .category-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #e5e7eb; padding: 4px; border-radius: 12px; margin-bottom: 14px; }
    .cat-btn { border: none; background: transparent; color: #4b5563; padding: 8px 0; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .cat-btn.active { background: #fff; color: #2563eb; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

    /* 输入区 */
    .input-box { display: flex; gap: 8px; margin-bottom: 14px; background: #fff; padding: 10px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .input-box input { flex: 1; border: none; outline: none; font-size: 15px; background: transparent; }
    .input-box button { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .input-box button:active { opacity: 0.85; }

    /* 状态筛选栏 */
    .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 8px; }
    .filter-btn { border: none; background: #e5e7eb; color: #374151; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .filter-btn.active { background: #1f2937; color: #fff; font-weight: 600; }

    /* 任务卡片 */
    .todo-list { display: flex; flex-direction: column; gap: 10px; }
    .todo-item { background: #fff; padding: 14px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 10px; }
    .todo-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .todo-title { font-size: 15px; line-height: 1.45; word-break: break-all; }
    .todo-title.done { text-decoration: line-through; color: #9ca3af; }
    .del-btn { background: none; border: none; color: #9ca3af; font-size: 13px; cursor: pointer; padding: 2px 4px; flex-shrink: 0; }
    .del-btn:hover { color: #ef4444; }

    /* 状态选择器 */
    .status-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .status-tag { border: 1px solid #e5e7eb; background: #f9fafb; color: #6b7280; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
    
    /* 四种状态的高亮配色 */
    .status-tag.active[data-status="未开始"] { background: #f3f4f6; border-color: #9ca3af; color: #374151; font-weight: 600; }
    .status-tag.active[data-status="正在进行"] { background: #dbeafe; border-color: #3b82f6; color: #1d4ed8; font-weight: 600; }
    .status-tag.active[data-status="收尾"] { background: #fef3c7; border-color: #f59e0b; color: #b45309; font-weight: 600; }
    .status-tag.active[data-status="已完成"] { background: #dcfce7; border-color: #22c55e; color: #15803d; font-weight: 600; }

    /* 专属标签功能 */
    .add-note-btn { margin-left: auto; border: 1px dashed #93c5fd; background: #eff6ff; color: #2563eb; padding: 4px 9px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .add-note-btn:hover { background: #dbeafe; }

    .note-display { background: #f8fafc; border-left: 3px solid #3b82f6; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: #334155; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; word-break: break-all; }
    .note-edit-link { color: #2563eb; font-size: 12px; border: none; background: none; cursor: pointer; flex-shrink: 0; }

    .note-editor { display: flex; gap: 6px; margin-top: 2px; }
    .note-editor input { flex: 1; border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px 10px; font-size: 13px; outline: none; }
    .note-editor input:focus { border-color: #3b82f6; }
    .note-save-btn { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
    .note-cancel-btn { background: #e5e7eb; color: #374151; border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }

    .empty { text-align: center; color: #9ca3af; font-size: 14px; padding: 40px 0; }
  </style>
</head>
<body>
  <header>
    <h1>待办事项管理</h1>
    <div class="subtitle" id="summary">加载中...</div>
  </header>

  <!-- 三大分区切换 -->
  <div class="category-tabs" id="categoryTabs">
    <button class="cat-btn active" onclick="setCategory('工作', this)">工作</button>
    <button class="cat-btn" onclick="setCategory('生活', this)">生活</button>
    <button class="cat-btn" onclick="setCategory('学习', this)">学习</button>
  </div>

  <!-- 添加输入框 -->
  <div class="input-box">
    <input type="text" id="todoInput" placeholder="在「工作」中添加新的待办事项..." />
    <button onclick="addTodo()">添加</button>
  </div>

  <!-- 状态筛选栏（随分区自动变化） -->
  <div class="filters" id="filterBar"></div>

  <!-- 任务列表 -->
  <div class="todo-list" id="todoList"></div>

  <script>
    const CATEGORY_CONFIG = {
      "工作": ["未开始", "正在进行", "收尾", "已完成"],
      "生活": ["未开始", "正在进行", "已完成"],
      "学习": ["未开始", "正在进行", "已完成"]
    };

    let currentCategory = "工作";
    let currentFilter = "全部";
    let editingNoteId = null;

    let todos = JSON.parse(localStorage.getItem("my_todos_v2")) || [];

    if (todos.length === 0 && localStorage.getItem("my_todos_v1")) {
      const oldTodos = JSON.parse(localStorage.getItem("my_todos_v1")) || [];
      const filteredOld = oldTodos.filter(
        t => t.text !== "熟悉待办清单的状态切换功能" && t.text !== "体验添加和删除一条新任务"
      );
      if (filteredOld.length > 0) {
        todos = filteredOld.map(t => ({ ...t, category: "工作", note: "" }));
        save();
      }
    }

    function save() {
      localStorage.setItem("my_todos_v2", JSON.stringify(todos));
    }

    function canShowTag(category, status) {
      if (category === "工作") {
        return status === "正在进行" || status === "收尾";
      }
      return status === "正在进行";
    }

    function setCategory(category, btn) {
      currentCategory = category;
      currentFilter = "全部";
      editingNoteId = null;

      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      document.getElementById("todoInput").placeholder = `在「${category}」中添加新的待办事项...`;
      render();
    }

    function addTodo() {
      const input = document.getElementById("todoInput");
      const text = input.value.trim();
      if (!text) return;
      todos.unshift({
        id: Date.now(),
        category: currentCategory,
        text,
        status: "未开始",
        note: ""
      });
      input.value = "";
      save();
      render();
    }

    function changeStatus(id, newStatus) {
      const item = todos.find(t => t.id === id);
      if (item) {
        item.status = newStatus;
        if (!canShowTag(item.category || "工作", newStatus) && editingNoteId === id) {
          editingNoteId = null;
        }
        save();
        render();
      }
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      if (editingNoteId === id) editingNoteId = null;
      save();
      render();
    }

    function setFilter(filter) {
      currentFilter = filter;
      editingNoteId = null;
      render();
    }

    function openNoteEditor(id) {
      editingNoteId = id;
      render();
      setTimeout(() => {
        const input = document.getElementById(`note-input-${id}`);
        if (input) input.focus();
      }, 0);
    }

    function cancelNoteEditor() {
      editingNoteId = null;
      render();
    }

    function saveNote(id) {
      const input = document.getElementById(`note-input-${id}`);
      if (!input) return;
      const item = todos.find(t => t.id === id);
      if (item) {
        item.note = input.value.trim();
        editingNoteId = null;
        save();
        render();
      }
    }

    function renderFilters() {
      const filterBar = document.getElementById("filterBar");
      const statuses = CATEGORY_CONFIG[currentCategory];
      const allFilters = ["全部", ...statuses];

      filterBar.innerHTML = allFilters.map(f => `
        <button
          class="filter-btn ${currentFilter === f ? 'active' : ''}"
          onclick="setFilter('${f}')"
        >${f}</button>
      `).join("");
    }

    function render() {
      renderFilters();

      const listEl = document.getElementById("todoList");
      const summaryEl = document.getElementById("summary");
      const statuses = CATEGORY_CONFIG[currentCategory];

      const catTodos = todos.filter(t => (t.category || "工作") === currentCategory);
      const doneCount = catTodos.filter(t => t.status === "已完成").length;
      summaryEl.textContent = `${currentCategory}分区 · 共 ${catTodos.length} 项任务 · 已完成 ${doneCount} 项`;

      const filtered = currentFilter === "全部"
        ? catTodos
        : catTodos.filter(t => t.status === currentFilter);

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty">「${currentCategory}」当前分类下暂无待办事项</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(item => {
        const itemCategory = item.category || "工作";
        const supportsTag = canShowTag(itemCategory, item.status);
        const isEditing = editingNoteId === item.id;

        return `
          <div class="todo-item">
            <div class="todo-top">
              <div class="todo-title ${item.status === '已完成' ? 'done' : ''}">${escapeHtml(item.text)}</div>
              <button class="del-btn" onclick="deleteTodo(${item.id})">删除</button>
            </div>

            <div class="status-group">
              ${statuses.map(st => `
                <button
                  class="status-tag ${item.status === st ? 'active' : ''}"
                  data-status="${st}"
                  onclick="changeStatus(${item.id}, '${st}')"
                >${st}</button>
              `).join("")}

              ${supportsTag && !isEditing ? `
                <button class="add-note-btn" onclick="openNoteEditor(${item.id})">
                  ${item.note ? '修改标签' : '+ 添加标签'}
                </button>
              ` : ''}
            </div>

            ${supportsTag && isEditing ? `
              <div class="note-editor">
                <input
                  type="text"
                  id="note-input-${item.id}"
                  value="${escapeHtml(item.note || '')}"
                  placeholder="输入标签或当前进度备注..."
                  onkeydown="if(event.key==='Enter') saveNote(${item.id})"
                />
                <button class="note-save-btn" onclick="saveNote(${item.id})">保存</button>
                <button class="note-cancel-btn" onclick="cancelNoteEditor()">取消</button>
              </div>
            ` : ''}

            ${supportsTag && !isEditing && item.note ? `
              <div class="note-display">
                <span>🏷️ ${escapeHtml(item.note)}</span>
                <button class="note-edit-link" onclick="openNoteEditor(${item.id})">编辑</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join("");
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    document.getElementById("todoInput").addEventListener("keydown", e => {
      if (e.key === "Enter") addTodo();
    });

    render();
  </script>
</body>
</html>
