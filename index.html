<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的实用工具箱</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        /* 按钮样式设计 */
        .nav-btn {
            display: block;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            margin: 15px 0;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .nav-btn:hover {
            background-color: #1d4ed8;
        }
        /* 第二个按钮换个颜色 */
        .btn-tomato {
            background-color: #e11d48;
        }
        .btn-tomato:hover {
            background-color: #be123c;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧰 我的个人工具箱</h1>
    <p>点击下方按钮选择要使用的网页工具</p>

    <!-- 按钮1：跳转到待办清单 -->
    <a href="todo.html" class="nav-btn">📝 待办清单 (To-Do)</a>

    <!-- 按钮2：跳转到番茄钟 -->
    <a href="tomato.html" class="nav-btn btn-tomato">🍅 番茄钟计时器</a>
</div>

</body>
</html>
